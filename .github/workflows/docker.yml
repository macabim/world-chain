name: docker

on:
  pull_request:
    paths:
      - "bin/world-chain/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Dockerfile"
      - ".github/workflows/docker.yml"
      - ".github/actions/docker-build-push-digest/**"
      - ".github/actions/prepare-hosted-runner/**"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to build. Leave blank to build the ref this run was launched from.
        required: false
        type: string
      image_tag:
        description: Mutable tag to publish alongside the immutable sha tag. "tag" applies the git tag (launch this run from a v* tag).
        required: true
        type: choice
        default: nightly
        options:
          - sha
          - nightly
          - alphanet
          - tag
  push:
    branches: [main]
    paths:
      - "bin/world-chain/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/config.toml"
      - "Dockerfile"
      - "scripts/**"
      - ".github/workflows/docker.yml"
      - ".github/actions/docker-build-push-digest/**"
      - ".github/actions/docker-merge-manifest/**"

env:
  REPO_NAME: ${{ github.event.repository.name }}
  IMAGE_NAME: ${{ github.repository }}
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  AWS_REGION: us-east-1
  SCCACHE_BUCKET: crypto-dev-us-east-1-workflow-build-cache

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    if: github.event_name != 'pull_request' || (github.repository_owner != 'worldcoin' && github.event.pull_request.head.repo.full_name == github.repository)
    name: build and push docker
    environment:
      name: dev
      deployment: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ${{ github.repository_owner == 'worldcoin' && 'arc-public-8xlarge-amd64-runner' || 'ubuntu-latest' }}
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check Out Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
      - name: Prepare hosted runner
        if: github.repository_owner != 'worldcoin'
        uses: ./.github/actions/prepare-hosted-runner
      - name: Build and push digest
        uses: ./.github/actions/docker-build-push-digest
        with:
          platform: ${{ matrix.platform }}
          registry: ${{ env.REGISTRY }}
          image_name: ${{ env.IMAGE_NAME }}
          aws_region: ${{ env.AWS_REGION }}
          sccache_bucket: ${{ env.SCCACHE_BUCKET }}
          no_cache_filters: runtime

  merge:
    runs-on: ubuntu-latest
    needs:
      - build-and-push
    steps:
      - name: Check Out Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Merge multi-arch manifest
        uses: ./.github/actions/docker-merge-manifest
        with:
          registry: ${{ env.REGISTRY }}
          image_name: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=nightly,enable=${{ inputs.image_tag == 'nightly' }}
            type=raw,value=alphanet,enable=${{ inputs.image_tag == 'alphanet' }}
            type=ref,event=tag,enable=${{ inputs.image_tag == 'tag' }}
